<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One page, chosen by its address</title>
<!--
  Snippet: one demo page that serves several slides.

  1. The slide picks a variant with a query parameter:
       <iframe data-src="variants/index.html?variant=many" …>
     The page reads it with URLSearchParams, and an unknown or missing value
     falls back to a default and says so, so a typo in slides.html shows up
     on the slide instead of as a blank frame.

  2. The first view comes from a fixed seed. Math.random() would draw a
     different first view on every load, so the slide, its preview picture
     (tools/capture-demo-previews.mjs) and what a presenter rehearsed would
     all differ. "Flip again" moves to the next seed, so readers still get
     new runs.

  3. Controls carry data-analytics-id, so the published site's usage
     analytics can tell them apart (explorables/ANALYTICS.md).

  Two frames of this page can sit side by side in one play-set (see the
  #side-by-side slide), but each is its own page: clicking in one doesn't
  change the other.
-->
<style>
  html, body { margin: 0; }
  body {
    box-sizing: border-box; width: 600px; height: 400px; overflow: hidden; padding: 20px 24px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
    font: 20px/1.4 "Nunito Sans", system-ui, -apple-system, sans-serif; color: #1e2742; background: transparent;
  }
  h1 { margin: 0; font-size: 26px; }
  svg { width: 100%; height: 100%; }
  .axis { stroke: #848ca3; stroke-width: 2; }
  .half { stroke: #f4ae00; stroke-width: 2; stroke-dasharray: 6 6; }
  .line { fill: none; stroke: #3d63bf; stroke-width: 4; stroke-linejoin: round; }
  .label { font-size: 18px; fill: #4a5470; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button { font: inherit; padding: 6px 16px; border-radius: 8px; border: 2px solid #3d63bf; background: #fff; color: #3d63bf; cursor: pointer; }
  .warning { color: #b23a48; }
</style>
</head>
<body>
  <h1 id="heading"></h1>
  <svg viewBox="0 0 552 260" role="img" aria-labelledby="chart-label">
    <title id="chart-label">The share of heads after each flip</title>
    <line class="axis" x1="40" y1="230" x2="540" y2="230"></line>
    <line class="axis" x1="40" y1="10" x2="40" y2="230"></line>
    <line class="half" x1="40" y1="120" x2="540" y2="120"></line>
    <text class="label" x="34" y="126" text-anchor="end">½</text>
    <polyline class="line" id="line"></polyline>
  </svg>
  <div class="row">
    <p id="result" role="status"></p>
    <button id="again" data-analytics-id="flip-again">Flip again</button>
  </div>
<script>
  // The variants a slide can ask for, and the one to use otherwise.
  const VARIANTS = {
    few: { flips: 20, label: "20 flips" },
    many: { flips: 2000, label: "2,000 flips" },
  };
  const DEFAULT = "few";

  const asked = new URLSearchParams(location.search).get("variant");
  const name = asked in VARIANTS ? asked : DEFAULT;
  const variant = VARIANTS[name];
  document.body.dataset.variant = name;

  const heading = document.getElementById("heading");
  heading.textContent = `The share of heads over ${variant.label}`;
  if (asked !== null && !(asked in VARIANTS)) {
    // Say so on the slide, rather than quietly showing something else.
    heading.textContent += ` (no variant "${asked}")`;
    heading.classList.add("warning");
  }

  /** A small seeded random number generator (mulberry32): the same seed gives the same numbers. */
  function seeded(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let seed = 1;

  function run() {
    const random = seeded(seed);
    let heads = 0;
    const points = [];
    for (let i = 1; i <= variant.flips; i++) {
      if (random() < 0.5) heads++;
      const x = 40 + (i / variant.flips) * 500;
      const y = 230 - (heads / i) * 220;
      points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    document.getElementById("line").setAttribute("points", points.join(" "));
    const share = heads / variant.flips;
    document.getElementById("result").textContent = `${heads} heads: ${(share * 100).toFixed(1)}%`;
    document.body.dataset.seed = String(seed);
  }

  document.getElementById("again").addEventListener("click", () => {
    seed += 1;
    run();
  });
  run();
</script>
</body>
</html>
