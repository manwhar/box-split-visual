<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&display=swap">
  <style>
    :root {
      --f-cover: "Nunito", "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-head: "Gill Sans", "Gill Sans MT", "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-body: "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 900px;
      height: 460px;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
      font-family: var(--f-body);
    }

    .demo-container {
      display: grid;
      grid-template-columns: 350px 136px 1fr;
      gap: 16px;
      width: 900px;
      height: 460px;
      padding: 16px;
      align-items: center;
      box-sizing: border-box;
    }

    /* Column 1: 3D Viewport */
    .canvas-wrap {
      position: relative;
      width: 350px;
      height: 350px;
      background: #f8fafc;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      border: 1px solid #cbd5e1;
      overflow: hidden;
      user-select: none;
    }

    #gl-canvas,
    #hud-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #gl-canvas {
      cursor: crosshair;
      touch-action: none;
    }

    #hud-canvas {
      pointer-events: none;
    }

    .btn-view-reset {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.9);
      color: #475569;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      transition: all 0.12s ease;
    }

    .btn-view-reset:hover {
      background: #ffffff;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .viewport-hint {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
    }

    /* Column 2: Controls */
    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 380px;
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-family: var(--f-head);
    }

    .btn-group {
      display: flex;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #f1f5f9;
      padding: 2px;
      gap: 2px;
    }

    .btn-tab {
      flex: 1;
      padding: 7px 4px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      color: #64748b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      font-family: var(--f-head);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-tab svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .btn-tab:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-tab.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.25);
    }

    /* Axis selector pills with subtle X/Y/Z dots */
    .axis-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .axis-dot.x { background: #ef4444; }
    .axis-dot.y { background: #16a34a; }
    .axis-dot.z { background: #2563eb; }

    .btn-tab.active .axis-dot {
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9);
    }

    /* Texture swatch selector */
    .texture-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .texture-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      font-family: var(--f-head);
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .texture-option:hover {
      border-color: #3b82f6;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .texture-option.active {
      border-color: #16a34a;
      background: #f0fdf4;
      color: #15803d;
      font-weight: 700;
      box-shadow: 0 0 0 1px #16a34a;
    }

    .texture-swatch {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      image-rendering: pixelated;
    }

    .btn-reset {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: auto;
      font-family: var(--f-head);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .btn-reset:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    /* Column 3: Python Code Panel */
    .code-panel {
      display: flex;
      flex-direction: column;
      height: 380px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      min-width: 0;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }

    .code-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #334155;
      font-family: var(--f-head);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-copy {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      cursor: pointer;
      font-family: var(--f-head);
      transition: all 0.12s ease;
    }

    .btn-copy:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .code-body {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: var(--f-mono);
      font-size: 11.5px;
      line-height: 1.5;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
      background: #ffffff;
      color: #1e293b;
    }

    .code-body::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .code-body::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .code-line {
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s ease-out, border-color 0.12s ease-out, color 0.12s ease-out;
      white-space: pre;
      border-left: 2.5px solid transparent;
      width: max-content;
      min-width: 100%;
    }

    .code-line.code-block-encompassed {
      background: rgba(2, 132, 199, 0.08);
      border-left-color: #0284c7;
      color: #0f172a;
    }

    .code-line.code-line-header-hover {
      background: rgba(2, 132, 199, 0.18);
      border-left-color: #0284c7;
      color: #0f172a;
    }

    .code-line .kw { color: #be185d; font-weight: 600; }
    .code-line .fn { color: #1d4ed8; font-weight: 600; }
    .code-line .dim { color: #7c3aed; font-weight: 600; }
    .code-line .num { color: #b45309; font-weight: 600; }
    .code-line .const { color: #047857; font-weight: 600; }

    .code-footer {
      padding: 5px 12px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #64748b;
      font-family: var(--f-body);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="demo-container">

    <!-- Left: 6x6x6 Interactive 3D Cube -->
    <div class="canvas-wrap">
      <canvas id="gl-canvas"></canvas>
      <canvas id="hud-canvas"></canvas>
      <button id="btn-view-reset" class="btn-view-reset" title="Reset camera view" aria-label="Reset camera view">&#8634;</button>
      <div id="viewport-hint" class="viewport-hint">Drag to move · Click to cut</div>
    </div>

    <!-- Middle: Controls -->
    <div class="controls-wrap">
      <div class="control-group">
        <span class="control-label">Tool</span>
        <div class="btn-group">
          <button id="tool-move" class="btn-tab" title="Move / Orbit camera &amp; Fill blocks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/>
              <path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/>
              <path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/>
              <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
            </svg>
            <span>Move</span>
          </button>
          <button id="tool-slice" class="btn-tab active" title="Slice 3D box along X, Y, or Z">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="3"/>
              <circle cx="6" cy="18" r="3"/>
              <line x1="20" y1="4" x2="8.12" y2="15.88"/>
              <line x1="14.47" y1="14.48" x2="20" y2="20"/>
              <line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
            <span>Slice</span>
          </button>
        </div>
      </div>

      <div id="slice-options" class="control-group">
        <span class="control-label">Slice Axis</span>
        <div class="btn-group">
          <button id="btn-axis-x" class="btn-tab active" data-axis="X"><span class="axis-dot x"></span>X</button>
          <button id="btn-axis-y" class="btn-tab" data-axis="Y"><span class="axis-dot y"></span>Y</button>
          <button id="btn-axis-z" class="btn-tab" data-axis="Z"><span class="axis-dot z"></span>Z</button>
        </div>
      </div>

      <div id="move-options" class="control-group" style="display: none;">
        <span class="control-label">Minecraft Block</span>
        <div class="texture-list">
          <button type="button" class="texture-option active" data-texture="oak_log">
            <canvas class="texture-swatch" id="swatch-oak-log" width="16" height="16"></canvas>
            <span>Oak Log</span>
          </button>
          <button type="button" class="texture-option" data-texture="cobblestone">
            <canvas class="texture-swatch" id="swatch-cobblestone" width="16" height="16"></canvas>
            <span>Cobblestone</span>
          </button>
          <button type="button" class="texture-option" data-texture="oak_planks">
            <canvas class="texture-swatch" id="swatch-oak-planks" width="16" height="16"></canvas>
            <span>Oak Planks</span>
          </button>
        </div>
      </div>

      <button id="btn-reset" class="btn-reset">Reset Cube</button>
    </div>

    <!-- Right: Live Python Grammar Code Panel -->
    <div class="code-panel">
      <div class="code-header">
        <div class="code-title">Live Python Code</div>
        <button id="btn-copy" class="btn-copy" title="Copy to clipboard">Copy</button>
      </div>
      <div class="code-body" id="code-body"></div>
      <div class="code-footer">
        <span>Hover code to highlight scope</span>
        <span id="copy-status"></span>
      </div>
    </div>

  </div>

  <script type="module">
    import { createInitialModel3D } from './model3d.js';
    import { BoxRenderer3D } from './renderer3d.js';
    import { BoxSplit3DController } from './interaction3d.js';
    import { TEXTURE_TYPES } from './textures.js';
    import { generateGrammarCode3D } from './codegen3d.js';

    const glCanvas = document.getElementById('gl-canvas');
    const hudCanvas = document.getElementById('hud-canvas');
    const viewportHint = document.getElementById('viewport-hint');

    let model = createInitialModel3D();
    const renderer = new BoxRenderer3D(glCanvas, hudCanvas);
    let isVisible = true;
    let currentRawCode = '';
    let currentCodeLines = [];

    let hoverTimer = null;
    const HOVER_DELAY_MS = 50;

    const codeBody = document.getElementById('code-body');
    const btnCopy = document.getElementById('btn-copy');
    const copyStatus = document.getElementById('copy-status');

    function clearCodeHighlights() {
      const lineEls = codeBody.querySelectorAll('.code-line');
      lineEls.forEach((el) => {
        el.classList.remove('code-block-encompassed', 'code-line-header-hover');
      });
    }

    function applyCodeHighlight(lineIndex) {
      clearCodeHighlights();
      const meta = currentCodeLines[lineIndex];
      if (!meta || meta.nodeId === null) {
        renderer.setCodeHighlightId(null);
        return;
      }

      const lineEls = codeBody.querySelectorAll('.code-line');
      for (let i = meta.blockStart; i <= meta.blockEnd; i++) {
        if (lineEls[i]) {
          lineEls[i].classList.add('code-block-encompassed');
        }
      }

      if (lineEls[lineIndex]) {
        lineEls[lineIndex].classList.add('code-line-header-hover');
      }

      renderer.setCodeHighlightId(meta.nodeId);
    }

    function updateCodePanel() {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }

      const { lines, fullRawText } = generateGrammarCode3D(model);
      currentRawCode = fullRawText;
      currentCodeLines = lines;

      codeBody.innerHTML = '';
      lines.forEach((line, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'code-line';
        lineEl.dataset.lineIndex = String(index);
        lineEl.innerHTML = line.textHtml;

        lineEl.addEventListener('mouseenter', () => {
          if (hoverTimer) clearTimeout(hoverTimer);
          hoverTimer = setTimeout(() => {
            applyCodeHighlight(index);
          }, HOVER_DELAY_MS);
        });

        lineEl.addEventListener('mouseleave', () => {
          if (hoverTimer) {
            clearTimeout(hoverTimer);
            hoverTimer = null;
          }
        });

        codeBody.appendChild(lineEl);
      });
    }

    codeBody.addEventListener('mouseleave', () => {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }
      clearCodeHighlights();
      renderer.setCodeHighlightId(null);
    });

    codeBody.addEventListener('mousemove', (e) => {
      if (!e.target.closest('.code-line')) {
        if (hoverTimer) {
          clearTimeout(hoverTimer);
          hoverTimer = null;
        }
        clearCodeHighlights();
        renderer.setCodeHighlightId(null);
      }
    });

    const controller = new BoxSplit3DController(
      model,
      renderer,
      () => updateCodePanel(),
      (mode) => {
        viewportHint.textContent = mode === 'move'
          ? 'Drag to move · Click to fill'
          : 'Drag to move · Click to cut';
      }
    );

    function drawSwatches() {
      const swatches = [
        { id: 'swatch-oak-log', type: TEXTURE_TYPES.OAK_LOG },
        { id: 'swatch-cobblestone', type: TEXTURE_TYPES.COBBLESTONE },
        { id: 'swatch-oak-planks', type: TEXTURE_TYPES.OAK_PLANKS },
      ];
      for (const s of swatches) {
        const swCanvas = document.getElementById(s.id);
        const texCanvas = renderer.textureLib.getCanvas(s.type);
        if (swCanvas && texCanvas) {
          const swCtx = swCanvas.getContext('2d');
          swCtx.drawImage(texCanvas, 0, 0);
        }
      }
    }
    drawSwatches();

    // Tool Buttons
    const toolMove = document.getElementById('tool-move');
    const toolSlice = document.getElementById('tool-slice');
    const sliceOptions = document.getElementById('slice-options');
    const moveOptions = document.getElementById('move-options');

    toolMove.addEventListener('click', () => {
      controller.setMode('move');
      toolMove.classList.add('active');
      toolSlice.classList.remove('active');
      sliceOptions.style.display = 'none';
      moveOptions.style.display = 'flex';
    });

    toolSlice.addEventListener('click', () => {
      controller.setMode('slice');
      toolSlice.classList.add('active');
      toolMove.classList.remove('active');
      sliceOptions.style.display = 'flex';
      moveOptions.style.display = 'none';
    });

    // Axis Selection (X, Y, Z)
    const axisBtns = [
      document.getElementById('btn-axis-x'),
      document.getElementById('btn-axis-y'),
      document.getElementById('btn-axis-z')
    ];
    axisBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        axisBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        controller.setAxis(btn.dataset.axis);
      });
    });

    // Texture Selection
    const textureOptions = document.querySelectorAll('.texture-option');
    textureOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        textureOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        controller.setTexture(opt.getAttribute('data-texture'));
      });
    });

    // Reset Camera View
    document.getElementById('btn-view-reset').addEventListener('click', () => {
      renderer.resetCamera();
    });

    // Reset Cube
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }
      model = createInitialModel3D();
      controller.model = model;
      controller.reset();
      clearCodeHighlights();
      renderer.setCodeHighlightId(null);
      updateCodePanel();
    });

    // Copy Button
    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentRawCode);
        copyStatus.textContent = 'Copied!';
        setTimeout(() => copyStatus.textContent = '', 2000);
      } catch (err) {
        copyStatus.textContent = 'Failed to copy';
      }
    });

    // Window & Deck Lifecycle
    function handleResize() {
      renderer.resize();
      if (isVisible) controller.render();
    }

    window.addEventListener('resize', handleResize);

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'deck:visibility') {
        isVisible = Boolean(event.data.visible);
        if (isVisible) controller.render();
      }
      if (event.data?.type === 'deck:resolution') {
        renderer.setResolution(event.data.detail || window.devicePixelRatio || 1);
        if (isVisible) controller.render();
      }
    });

    handleResize();
    updateCodePanel();
  </script>
</body>

</html>
