<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&display=swap">
  <style>
    :root {
      --f-cover: "Nunito", "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-head: "Gill Sans", "Gill Sans MT", "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-body: "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 900px;
      height: 460px;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
      font-family: var(--f-body);
    }

    .demo-container {
      display: grid;
      grid-template-columns: 312px 154px 1fr;
      gap: 12px;
      width: 900px;
      height: 460px;
      padding: 12px 14px;
      align-items: center;
    }

    /* Column 1: Castle Wall Elevation Canvas */
    .canvas-wrap {
      width: 312px;
      height: 434px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }

    .canvas-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 11px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      font-family: var(--f-head);
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-pill {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0.02em;
    }

    .status-pill.wide {
      background: #dcfce7;
      color: #166534;
    }

    .status-pill.narrow {
      background: #fef3c7;
      color: #92400e;
    }

    .canvas-stage {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 76%, #cbd5e1 76%, #94a3b8 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .canvas-foot {
      padding: 6px 11px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Column 2: Controls */
    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 434px;
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 9px 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      font-family: var(--f-head);
    }

    .control-val {
      font-family: var(--f-mono);
      font-size: 11px;
      font-weight: 600;
      color: #1d4ed8;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
      cursor: pointer;
      margin: 2px 0 0;
    }

    .tick-note {
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      color: #64748b;
    }

    .btn-group {
      display: flex;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #f1f5f9;
      padding: 2px;
      gap: 2px;
    }

    .btn-tab {
      flex: 1;
      padding: 6px 4px;
      font-size: 11.5px;
      font-weight: 600;
      background: transparent;
      color: #64748b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      font-family: var(--f-head);
    }

    .btn-tab:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-tab.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.25);
    }

    .btn-regen {
      padding: 10px 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #1d4ed8;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--f-head);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .btn-regen:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-regen:active {
      transform: translateY(0);
    }

    .btn-regen:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* Column 3: Live Python Grammar Rules Panel */
    .code-panel {
      display: flex;
      flex-direction: column;
      height: 434px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      min-width: 0;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }

    .code-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #334155;
      font-family: var(--f-head);
    }

    .code-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }

    .rule-card {
      border: 1px solid #e2e8f0;
      border-left: 3.5px solid #94a3b8;
      border-radius: 6px;
      padding: 4px 8px;
      background: #f8fafc;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .rule-card.active {
      border-color: #cbd5e1;
      border-left-color: #16a34a;
      background: #ffffff;
    }

    .rule-card.skipped {
      opacity: 0.45;
      background: #f8fafc;
    }

    .rule-card.hovered {
      border-color: #38bdf8;
      border-left-color: #0284c7;
      background: #f0f9ff;
      opacity: 1;
    }

    .rule-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      font-family: var(--f-head);
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 9px;
    }

    .badge.fired {
      background: #dcfce7;
      color: #15803d;
    }

    .badge.skipped {
      background: #e2e8f0;
      color: #64748b;
    }

    .badge.variant {
      background: #e0e7ff;
      color: #3730a3;
    }

    .rule-code {
      font-family: var(--f-mono);
      font-size: 9.8px;
      line-height: 1.22;
      white-space: pre;
      color: #1e293b;
      overflow-x: auto;
    }

    .kw { color: #be185d; font-weight: 600; }
    .fn { color: #1d4ed8; font-weight: 600; }
    .dim { color: #7c3aed; font-weight: 600; }
    .num { color: #b45309; font-weight: 600; }
    .neg { color: #be185d; background: rgba(190, 24, 93, 0.1); padding: 0 3px; border-radius: 3px; }
    .const { color: #047857; font-weight: 600; }

    .code-footer {
      padding: 5px 12px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="demo-container">

    <!-- Left: Castle Wall Elevation Canvas -->
    <div class="canvas-wrap">
      <div class="canvas-head">
        <span>Castle Wall (<span id="dim-badge">11 × 4</span>)</span>
        <span id="constraint-pill" class="status-pill wide">Gate in Wall</span>
      </div>
      <div class="canvas-stage">
        <canvas id="wall-canvas"></canvas>
      </div>
      <div class="canvas-foot">
        <span id="bay-summary">Repeat [1, 1] top · Hover rule</span>
      </div>
    </div>

    <!-- Middle: Controls -->
    <div class="controls-wrap">
      <div class="control-group">
        <div class="label-row">
          <span class="control-label">Width (X)</span>
          <span class="control-val" id="width-val">11 blocks</span>
        </div>
        <input type="range" id="slider-width" min="6" max="15" step="1" value="11">
      </div>

      <div class="control-group">
        <div class="label-row">
          <span class="control-label">Height (Y)</span>
          <span class="control-val" id="height-val">4 blocks</span>
        </div>
        <input type="range" id="slider-height" min="4" max="7" step="1" value="4">
      </div>

      <div class="control-group">
        <span class="control-label">Battlement Loop</span>
        <div class="btn-group">
          <button id="loop-off" class="btn-tab">Flat</button>
          <button id="loop-on" class="btn-tab active">Repeat [1, 1]</button>
        </div>
      </div>

      <button id="btn-regenerate" class="btn-regen">
        <span>&#8635;</span>
        <span>Regenerate Variants</span>
      </button>
    </div>

    <!-- Right: Live Python Grammar Rules Panel -->
    <div class="code-panel">
      <div class="code-header">
        <span class="code-title">castle_wall.py</span>
      </div>
      <div class="code-body" id="rules-list"></div>
      <div class="code-footer">
        <span>Hover over a rule to highlight blocks</span>
      </div>
    </div>

  </div>

  <script type="module">
    import { TextureLibrary } from './textures.js';
    import { evaluateWallGrammar } from './rules_engine.js';

    const canvas = document.getElementById('wall-canvas');
    const ctx = canvas.getContext('2d');
    const textureLib = new TextureLibrary();

    const state = {
      width: 11,
      height: 4,
      repeatLoop: true,
      seed: 42,
      hoverRule: null,
      detailScale: window.devicePixelRatio || 1,
      isVisible: true
    };

    let lastResult = evaluateWallGrammar(state);

    const sliderWidth = document.getElementById('slider-width');
    const sliderHeight = document.getElementById('slider-height');
    const widthVal = document.getElementById('width-val');
    const heightVal = document.getElementById('height-val');
    const dimBadge = document.getElementById('dim-badge');
    const constraintPill = document.getElementById('constraint-pill');
    const baySummary = document.getElementById('bay-summary');
    const loopOff = document.getElementById('loop-off');
    const loopOn = document.getElementById('loop-on');
    const btnRegen = document.getElementById('btn-regenerate');
    const rulesList = document.getElementById('rules-list');

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      canvas.width = Math.round(w * state.detailScale);
      canvas.height = Math.round(h * state.detailScale);
      ctx.setTransform(state.detailScale, 0, 0, state.detailScale, 0, 0);
    }

    function matchesHover(cell, hoverRule) {
      if (!hoverRule) return true;
      if (hoverRule === 'wall_rule') {
        return cell.ruleTag === 'wall_loop' || cell.ruleTag === 'wall_flat';
      }
      if (hoverRule === 'lower_gate') {
        return cell.ruleTag === 'lower_gate' || cell.ruleTag.startsWith('body_');
      }
      if (hoverRule === 'lower_plain') {
        return cell.ruleTag.startsWith('body_');
      }
      return cell.ruleTag === hoverRule;
    }

    function renderCanvas() {
      if (!state.isVisible) return;
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      if (!cw || !ch) return;

      ctx.clearRect(0, 0, cw, ch);
      ctx.imageSmoothingEnabled = false;

      const padX = 16;
      const padTop = 32;
      const padBot = 52;
      const maxCell = Math.floor(Math.min((cw - padX * 2) / 15, (ch - padTop - padBot) / 7));
      const cellSize = Math.max(16, maxCell);
      const totalW = state.width * cellSize;
      const totalH = state.height * cellSize;
      const ox = Math.round((cw - totalW) / 2);
      const oy = Math.round(ch - padBot - totalH);

      // Draw castle blocks (skip null = void/air so sky shows cleanly)
      for (const cell of lastResult.cells) {
        const isMatched = matchesHover(cell, state.hoverRule);
        ctx.save();
        if (!isMatched) ctx.globalAlpha = 0.25;

        if (cell.material) {
          const tex = textureLib.getSideCanvas(cell.material) || textureLib.getCanvas(cell.material);
          for (let dx = 0; dx < cell.w; dx++) {
            for (let dy = 0; dy < cell.h; dy++) {
              const gx = cell.x + dx;
              const gy = state.height - 1 - (cell.y + dy);
              const px = ox + gx * cellSize;
              const py = oy + gy * cellSize;
              if (tex) ctx.drawImage(tex, px, py, cellSize, cellSize);
            }
          }
        } else if (state.hoverRule && isMatched) {
          // Subtle sky tint highlight for void() arrow slits when hovering a rule
          const rx = ox + cell.x * cellSize;
          const ry = oy + (state.height - cell.y - cell.h) * cellSize;
          ctx.fillStyle = 'rgba(2, 132, 199, 0.16)';
          ctx.fillRect(rx, ry, cell.w * cellSize, cell.h * cellSize);
        }

        if (state.hoverRule && isMatched && cell.material) {
          const rx = ox + cell.x * cellSize;
          const ry = oy + (state.height - cell.y - cell.h) * cellSize;
          ctx.strokeStyle = '#0284c7';
          ctx.lineWidth = 2;
          ctx.strokeRect(rx + 1, ry + 1, cell.w * cellSize - 2, cell.h * cellSize - 2);
        }
        ctx.restore();
      }

      // Faint outer bounding box guide showing the root scope
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.35)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(ox, oy, totalW, totalH);
      ctx.setLineDash([]);

      // Bottom dimension labels matching [-1, 3, -1] (3-wide gate)
      ctx.font = '600 10.5px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      if (lastResult.gateActive) {
        const innerTotal = state.width - 3;
        const leftWallW = Math.floor(innerTotal / 2) + (innerTotal % 2);
        const rightWallW = Math.floor(innerTotal / 2);
        const spans = [
          { w: leftWallW, label: `-1 (${leftWallW})`, color: '#be185d' },
          { w: 3, label: '3 (gate)', color: '#be185d' },
          { w: rightWallW, label: `-1 (${rightWallW})`, color: '#be185d' }
        ];
        let cursorX = ox;
        for (const sp of spans) {
          const pxW = sp.w * cellSize;
          ctx.fillStyle = sp.color;
          ctx.fillText(sp.label, cursorX + pxW / 2, oy + totalH + 16);
          cursorX += pxW;
        }
      }
    }

    function buildRuleCards() {
      const fired = lastResult.firedRules;
      const cards = [
        {
          id: 'wall_rule',
          label: '1. Battlement Loop',
          active: fired.has('wall_loop') || fired.has('wall_flat'),
          badge: state.repeatLoop ? 'REPEAT=TRUE' : 'FLAT',
          badgeCls: state.repeatLoop ? 'fired' : 'variant',
          html: state.repeatLoop
            ? `<span class="kw">@rule</span>
<span class="kw">def</span> <span class="fn">castle_wall</span>():
  <span class="kw">with</span> <span class="fn">split</span>(<span class="dim">Dimension.Y</span>, [<span class="num neg">-1</span>, <span class="num">1</span>]):
    <span class="fn">wall_base</span>()
    pieces = <span class="fn">split</span>(<span class="dim">Dimension.X</span>, [<span class="num">1</span>, <span class="num">1</span>], repeat=<span class="kw">True</span>)
    <span class="kw">while</span> pieces:
      <span class="fn">fill</span>(<span class="const">COBBLESTONE</span>)
      <span class="fn">void</span>()`
            : `<span class="kw">@rule</span>
<span class="kw">def</span> <span class="fn">castle_wall</span>():
  <span class="kw">with</span> <span class="fn">split</span>(<span class="dim">Dimension.Y</span>, [<span class="num neg">-1</span>, <span class="num">1</span>]):
    <span class="fn">wall_base</span>()
    <span class="fn">fill</span>(<span class="const">COBBLESTONE</span>)`
        },
        {
          id: 'lower_gate',
          label: '2a. Gate Constraint (Width > 9)',
          active: fired.has('lower_gate'),
          badge: fired.has('lower_gate') ? 'ACTIVE' : 'SKIPPED',
          badgeCls: fired.has('lower_gate') ? 'fired' : 'skipped',
          html: `<span class="kw">@rule</span>(constraint=<span class="dim">Dimension.X</span> &gt; <span class="num">9</span>)
<span class="kw">def</span> <span class="fn">wall_base</span>():
  <span class="kw">with</span> <span class="fn">split</span>(<span class="dim">Dimension.X</span>, [<span class="num neg">-1</span>, <span class="num">3</span>, <span class="num neg">-1</span>]):
    <span class="fn">wall_body</span>()
    <span class="fn">gate</span>()
    <span class="fn">wall_body</span>()`
        },
        {
          id: 'lower_plain',
          label: '2b. Plain Wall Fallback',
          active: fired.has('lower_plain'),
          badge: fired.has('lower_plain') ? 'ACTIVE' : 'SKIPPED',
          badgeCls: fired.has('lower_plain') ? 'fired' : 'skipped',
          html: `<span class="kw">@rule</span>(constraint=<span class="const">Constraint.ELSE</span>)
<span class="kw">def</span> <span class="fn">wall_base</span>():
  <span class="fn">wall_body</span>()`
        },
        {
          id: 'body_cobble',
          label: '3a. Variant A (Cobblestone)',
          active: fired.has('body_cobble'),
          badge: fired.has('body_cobble') ? 'PICKED' : 'SKIPPED',
          badgeCls: fired.has('body_cobble') ? 'fired' : 'skipped',
          html: `<span class="kw">@rule</span>(probability=<span class="num">0.5</span>)
<span class="kw">def</span> <span class="fn">wall_body</span>():
  <span class="fn">fill</span>(<span class="const">COBBLESTONE</span>)`
        },
        {
          id: 'body_mossy',
          label: '3b. Variant B (Mossy Cobblestone)',
          active: fired.has('body_mossy'),
          badge: fired.has('body_mossy') ? 'PICKED' : 'SKIPPED',
          badgeCls: fired.has('body_mossy') ? 'fired' : 'skipped',
          html: `<span class="kw">@rule</span>(probability=<span class="num">0.5</span>)
<span class="kw">def</span> <span class="fn">wall_body</span>():
  <span class="fn">fill</span>(<span class="const">MOSSY_COBBLESTONE</span>)`
        }
      ];

      rulesList.innerHTML = '';
      for (const c of cards) {
        const el = document.createElement('div');
        el.className = `rule-card ${c.active ? 'active' : 'skipped'}`;
        el.innerHTML = `
          <div class="rule-meta">
            <span>${c.label}</span>
            <span class="badge ${c.badgeCls}">${c.badge}</span>
          </div>
          <div class="rule-code">${c.html}</div>
        `;
        el.addEventListener('mouseenter', () => {
          state.hoverRule = c.id;
          el.classList.add('hovered');
          renderCanvas();
        });
        el.addEventListener('mouseleave', () => {
          state.hoverRule = null;
          el.classList.remove('hovered');
          renderCanvas();
        });
        rulesList.appendChild(el);
      }
    }

    function update() {
      lastResult = evaluateWallGrammar(state);
      widthVal.textContent = `${state.width} blocks`;
      heightVal.textContent = `${state.height} blocks`;
      dimBadge.textContent = `${state.width} × ${state.height}`;

      if (lastResult.gateActive) {
        constraintPill.textContent = 'Gate in Wall';
        constraintPill.className = 'status-pill wide';
      } else {
        constraintPill.textContent = 'Plain Wall';
        constraintPill.className = 'status-pill narrow';
      }
      btnRegen.disabled = false;
      const hasCobble = lastResult.bayResults.some(b => b.variant === 'cobble');
      const hasMossy = lastResult.bayResults.some(b => b.variant === 'mossy');
      const parts = [state.repeatLoop ? 'Repeat [1, 1]' : 'Flat'];
      if (hasCobble) parts.push('Cobblestone');
      if (hasMossy) parts.push('Mossy Cobblestone');
      baySummary.textContent = parts.join(' · ');

      buildRuleCards();
      renderCanvas();
    }

    sliderWidth.addEventListener('input', () => {
      state.width = Number(sliderWidth.value);
      update();
    });

    sliderHeight.addEventListener('input', () => {
      state.height = Number(sliderHeight.value);
      update();
    });

    loopOff.addEventListener('click', () => {
      state.repeatLoop = false;
      loopOff.classList.add('active');
      loopOn.classList.remove('active');
      update();
    });

    loopOn.addEventListener('click', () => {
      state.repeatLoop = true;
      loopOn.classList.add('active');
      loopOff.classList.remove('active');
      update();
    });

    btnRegen.addEventListener('click', () => {
      const prevVariants = lastResult.bayResults.map((b) => b.variant).join(',');
      for (let i = 0; i < 16; i++) {
        state.seed += 1;
        const candidate = evaluateWallGrammar(state);
        const nextVariants = candidate.bayResults.map((b) => b.variant).join(',');
        if (nextVariants !== prevVariants) break;
      }
      update();
    });

    window.addEventListener('resize', () => {
      resize();
      renderCanvas();
    });

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'deck:visibility') {
        state.isVisible = Boolean(event.data.visible);
        if (state.isVisible) renderCanvas();
      }
      if (event.data?.type === 'deck:resolution') {
        state.detailScale = event.data.detail || window.devicePixelRatio || 1;
        resize();
        renderCanvas();
      }
    });

    resize();
    update();
  </script>
</body>

</html>
