<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Castle Wall Box-Split Grammar Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&display=swap">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #1e2742;
      --ink-2: #4a5470;
      --ink-3: #848ca3;
      --line: #dfe5ef;
      --shadow: 0 1px 2px rgba(30, 40, 60, 0.05), 0 8px 24px rgba(30, 40, 60, 0.07);
      --f-head: "Gill Sans", "Gill Sans MT", "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-body: "Nunito Sans", system-ui, -apple-system, sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1290px;
      height: 380px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .rules-stage {
      width: 1290px;
      height: 380px;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 460px 222px 536px;
      gap: 18px;
      align-items: center;
    }

    .stage-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .col-caption {
      height: 26px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      padding-left: 4px;
      font-family: var(--f-head);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ink-2);
    }

    .col-caption code {
      font-family: var(--f-mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .wall-card,
    .grammar-panel {
      height: 314px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .wall-card {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #wall-canvas {
      display: block;
      width: 436px;
      height: 282px;
      cursor: default;
    }

    /* Middle Column: Minimal Mode-Specific Controls */
    .controls-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding-top: 34px;
    }

    .control-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .control-label {
      font-family: var(--f-head);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-2);
    }

    .control-val {
      font-family: var(--f-mono);
      font-size: 13px;
      font-weight: 700;
      color: #1d4ed8;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
      cursor: pointer;
      margin: 2px 0;
    }

    .threshold-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--ink-3);
    }

    .btn-group {
      display: flex;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f1f5f9;
      padding: 3px;
      gap: 3px;
    }

    .btn-tab {
      flex: 1 1 auto;
      white-space: nowrap;
      padding: 8px 8px;
      font-family: var(--f-head);
      font-size: 13.5px;
      font-weight: 600;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-tab:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-tab.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(37, 99, 235, 0.28);
    }

    .btn-regen {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #1d4ed8;
      background: #2563eb;
      color: #ffffff;
      font-family: var(--f-head);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.24);
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .btn-regen:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-regen:active {
      transform: translateY(0);
    }

    .variant-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .variant-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .variant-row:hover,
    .variant-row.is-active {
      border-color: #0284c7;
      background: #f0f9ff;
    }

    .variant-swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(15, 23, 42, 0.16);
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .variant-name {
      flex: 1;
      font-family: var(--f-head);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }

    .variant-prob {
      font-family: var(--f-mono);
      font-size: 12.5px;
      font-weight: 700;
      color: #b45309;
    }

    /* Right Column: Clean Single-File castle_wall.py Panel */
    .grammar-panel {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      min-width: 0;
    }

    .code-body {
      display: flex;
      flex-direction: column;
      font-family: var(--f-mono);
      font-size: 14.5px;
      line-height: 1.42;
      color: #1e293b;
    }

    .code-gap {
      height: 9px;
    }

    .code-line {
      padding: 2px 8px;
      border-radius: 6px;
      border-left: 3.5px solid transparent;
      white-space: pre;
      cursor: pointer;
      transition: opacity 0.18s ease, background-color 0.14s ease, border-color 0.14s ease;
    }

    .code-line.is-rule-fired {
      border-left-color: #16a34a;
    }

    .code-line.is-rule-dimmed {
      opacity: 0.34;
      cursor: default;
    }

    .code-line.is-encompassed {
      background: rgba(2, 132, 199, 0.08);
      border-left-color: #0284c7;
      color: #0f172a;
    }

    .code-line.is-focus {
      background: rgba(2, 132, 199, 0.18);
      border-left-color: #0284c7;
      color: #0f172a;
    }

    .code-body .kw { color: #be185d; font-weight: 600; }
    .code-body .fn { color: #1d4ed8; font-weight: 600; }
    .code-body .dim { color: #7c3aed; font-weight: 600; }
    .code-body .num { color: #b45309; font-weight: 600; }
    .code-body .neg {
      color: #be185d;
      font-weight: 600;
      background: rgba(190, 24, 93, 0.1);
      padding: 0 4px;
      border-radius: 4px;
    }
    .code-body .const { color: #047857; font-weight: 600; }
  </style>
</head>

<body>
  <main class="rules-stage">
    <section class="stage-col wall-col">
      <div class="col-caption"><code>castle_wall()</code></div>
      <div class="wall-card">
        <canvas id="wall-canvas" width="476" height="560"></canvas>
      </div>
    </section>

    <aside class="controls-col" id="controls-col" aria-label="Rule Controls"></aside>

    <section class="stage-col code-col">
      <div class="col-caption"><code>castle_wall.py</code></div>
      <div class="grammar-panel" aria-label="castle_wall.py Box-Split Grammar Code">
        <div class="code-body" id="code-lines"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { TextureLibrary } from './textures.js?v=5';
    import {
      evaluateConstraintsWall,
      evaluateLoopsWall,
      evaluateVariantsWall,
      nextDistinctSeed
    } from './rules_engine.js?v=6';

    const params = new URLSearchParams(location.search);
    const rawMode = params.get('mode') || 'constraints';
    const MODE = ['constraints', 'loops', 'variants'].includes(rawMode) ? rawMode : 'constraints';

    const kw = (s) => `<span class="kw">${s}</span>`;
    const fn = (s) => `<span class="fn">${s}</span>`;
    const dim = (s) => `<span class="dim">${s}</span>`;
    const num = (s) => `<span class="num">${s}</span>`;
    const neg = (s) => `<span class="neg">${s}</span>`;
    const con = (s) => `<span class="const">${s}</span>`;
    const sp = (n) => '&nbsp;'.repeat(n);

    const CELL_PX = 28;

    const canvas = document.getElementById('wall-canvas');
    const ctx = canvas.getContext('2d');
    const controlsCol = document.getElementById('controls-col');
    const codeLinesEl = document.getElementById('code-lines');

    const textureLib = new TextureLibrary();
    const fallbackBricks = makeFallbackBricks();
    const assetTextures = {};

    const state = {
      width: 11,
      height: 6,
      repeatLoop: true,
      seed: 7,
      detailScale: window.devicePixelRatio || 1,
      isVisible: true,
      hoverScopes: null,
      hoverLineId: null,
      prevCellsMap: null,
      fadeProgress: 1,
      fadeToken: 0
    };

    let currentEval = evaluateState();
    let currentCodeMeta = [];
    const lineElMap = new Map();
    const variantRowMap = new Map();

    function makeFallbackBricks() {
      const c = document.createElement('canvas');
      c.width = 16;
      c.height = 16;
      const g = c.getContext('2d');
      g.fillStyle = '#7c7c7c';
      g.fillRect(0, 0, 16, 16);
      g.fillStyle = '#5c5c5c';
      g.fillRect(0, 0, 16, 1);
      g.fillRect(0, 8, 16, 1);
      g.fillRect(8, 1, 1, 7);
      g.fillRect(0, 9, 1, 7);
      g.fillStyle = '#929292';
      g.fillRect(1, 2, 6, 2);
      g.fillRect(2, 10, 12, 2);
      return c;
    }

    function loadAssetTexture(key, src) {
      const img = new Image();
      img.onload = () => {
        assetTextures[key] = img;
        if (state.isVisible) renderCanvas();
      };
      img.src = src;
    }

    loadAssetTexture('stone_bricks', 'assets/stone_bricks.png?v=5');
    loadAssetTexture('cobblestone', 'assets/cobblestone.png?v=5');
    loadAssetTexture('oak_planks', 'assets/oak_planks.png?v=5');

    function getTextureSource(materialId) {
      if (materialId === 'stone_bricks') {
        return assetTextures.stone_bricks || fallbackBricks;
      }
      if (materialId === 'cobblestone') {
        return assetTextures.cobblestone || textureLib.getCanvas('cobblestone');
      }
      if (materialId === 'oak_planks') {
        return assetTextures.oak_planks || textureLib.getCanvas('oak_planks');
      }
      if (materialId === 'mossy_cobblestone') {
        return textureLib.getCanvas('mossy_cobblestone');
      }
      return textureLib.getCanvas(materialId);
    }

    function evaluateState() {
      if (MODE === 'constraints') return evaluateConstraintsWall(state.width, state.height);
      if (MODE === 'loops') return evaluateLoopsWall(state.width, state.repeatLoop, state.height);
      return evaluateVariantsWall(state.seed, state.width, state.height);
    }

    function buildCodeSpec() {
      if (MODE === 'constraints') {
        return [
          {
            id: 'c-dec-gt',
            ruleGroup: 'rule_gate',
            scopes: ['c_left', 'c_gate', 'c_right'],
            blockLines: ['c-def-gt', 'c-split-gt', 'c-fill-l', 'c-gate', 'c-fill-r'],
            html: `${kw('@rule')}(constraint=${dim('Dimension.X')} &gt; ${num('9')})`
          },
          {
            id: 'c-def-gt',
            ruleGroup: 'rule_gate',
            scopes: ['c_left', 'c_gate', 'c_right'],
            blockLines: ['c-split-gt', 'c-fill-l', 'c-gate', 'c-fill-r'],
            html: `${kw('def')} ${fn('castle_wall')}():`
          },
          {
            id: 'c-split-gt',
            ruleGroup: 'rule_gate',
            scopes: ['c_left', 'c_gate', 'c_right'],
            blockLines: ['c-fill-l', 'c-gate', 'c-fill-r'],
            html: `${sp(2)}${kw('with')} ${fn('split')}(${dim('Dimension.X')}, [${neg('-1')}, ${num('3')}, ${neg('-1')}]):`
          },
          {
            id: 'c-fill-l',
            ruleGroup: 'rule_gate',
            scopes: ['c_left'],
            html: `${sp(4)}${fn('fill')}(${con('STONE_BRICKS')})`
          },
          {
            id: 'c-gate',
            ruleGroup: 'rule_gate',
            scopes: ['c_gate'],
            html: `${sp(4)}${fn('gate')}()`
          },
          {
            id: 'c-fill-r',
            ruleGroup: 'rule_gate',
            scopes: ['c_right'],
            html: `${sp(4)}${fn('fill')}(${con('STONE_BRICKS')})`
          },
          { gap: true },
          {
            id: 'c-dec-else',
            ruleGroup: 'rule_else',
            scopes: ['c_else'],
            blockLines: ['c-def-else', 'c-fill-else'],
            html: `${kw('@rule')}(constraint=${con('Constraint.ELSE')})`
          },
          {
            id: 'c-def-else',
            ruleGroup: 'rule_else',
            scopes: ['c_else'],
            blockLines: ['c-fill-else'],
            html: `${kw('def')} ${fn('castle_wall')}():`
          },
          {
            id: 'c-fill-else',
            ruleGroup: 'rule_else',
            scopes: ['c_else'],
            html: `${sp(2)}${fn('fill')}(${con('STONE_BRICKS')})`
          }
        ];
      }

      if (MODE === 'loops') {
        if (state.repeatLoop) {
          return [
            {
              id: 'l-dec',
              ruleGroup: 'loop',
              scopes: ['l_base', 'l_merlon', 'l_void'],
              blockLines: ['l-def', 'l-split-y', 'l-base', 'l-split-x', 'l-while', 'l-fill', 'l-void'],
              html: `${kw('@rule')}`
            },
            {
              id: 'l-def',
              ruleGroup: 'loop',
              scopes: ['l_base', 'l_merlon', 'l_void'],
              blockLines: ['l-split-y', 'l-base', 'l-split-x', 'l-while', 'l-fill', 'l-void'],
              html: `${kw('def')} ${fn('castle_wall')}():`
            },
            {
              id: 'l-split-y',
              ruleGroup: 'loop',
              scopes: ['l_base', 'l_merlon', 'l_void'],
              blockLines: ['l-base', 'l-split-x', 'l-while', 'l-fill', 'l-void'],
              html: `${sp(2)}${kw('with')} ${fn('split')}(${dim('Dimension.Y')}, [${neg('-1')}, ${num('1')}]):`
            },
            {
              id: 'l-base',
              ruleGroup: 'loop',
              scopes: ['l_base'],
              html: `${sp(4)}${fn('wall_base')}()`
            },
            {
              id: 'l-split-x',
              ruleGroup: 'loop',
              scopes: ['l_merlon', 'l_void'],
              blockLines: ['l-while', 'l-fill', 'l-void'],
              html: `${sp(4)}pieces = ${fn('split')}(${dim('Dimension.X')}, [${num('1')}, ${num('1')}], repeat=${kw('True')})`
            },
            {
              id: 'l-while',
              ruleGroup: 'loop',
              scopes: ['l_merlon', 'l_void'],
              blockLines: ['l-fill', 'l-void'],
              html: `${sp(4)}${kw('while')} pieces:`
            },
            {
              id: 'l-fill',
              ruleGroup: 'loop',
              scopes: ['l_merlon'],
              html: `${sp(6)}${fn('fill')}(${con('STONE_BRICKS')})`
            },
            {
              id: 'l-void',
              ruleGroup: 'loop',
              scopes: ['l_void'],
              html: `${sp(6)}${fn('void')}()`
            }
          ];
        }
        return [
          {
            id: 'l-dec',
            ruleGroup: 'loop',
            scopes: ['l_base', 'l_flat'],
            blockLines: ['l-def', 'l-split-y', 'l-base', 'l-flat'],
            html: `${kw('@rule')}`
          },
          {
            id: 'l-def',
            ruleGroup: 'loop',
            scopes: ['l_base', 'l_flat'],
            blockLines: ['l-split-y', 'l-base', 'l-flat'],
            html: `${kw('def')} ${fn('castle_wall')}():`
          },
          {
            id: 'l-split-y',
            ruleGroup: 'loop',
            scopes: ['l_base', 'l_flat'],
            blockLines: ['l-base', 'l-flat'],
            html: `${sp(2)}${kw('with')} ${fn('split')}(${dim('Dimension.Y')}, [${neg('-1')}, ${num('1')}]):`
          },
          {
            id: 'l-base',
            ruleGroup: 'loop',
            scopes: ['l_base'],
            html: `${sp(4)}${fn('wall_base')}()`
          },
          {
            id: 'l-flat',
            ruleGroup: 'loop',
            scopes: ['l_flat'],
            html: `${sp(4)}${fn('fill')}(${con('STONE_BRICKS')})`
          }
        ];
      }

      return [
        {
          id: 'v-dec-bricks',
          ruleGroup: 'v_bricks',
          scopes: ['v_bricks'],
          blockLines: ['v-def-bricks', 'v-fill-bricks'],
          html: `${kw('@rule')}(probability=${num('0.6')})`
        },
        {
          id: 'v-def-bricks',
          ruleGroup: 'v_bricks',
          scopes: ['v_bricks'],
          blockLines: ['v-fill-bricks'],
          html: `${kw('def')} ${fn('wall_block')}():`
        },
        {
          id: 'v-fill-bricks',
          ruleGroup: 'v_bricks',
          scopes: ['v_bricks'],
          html: `${sp(2)}${fn('fill')}(${con('STONE_BRICKS')})`
        },
        { gap: true },
        {
          id: 'v-dec-mossy',
          ruleGroup: 'v_mossy',
          scopes: ['v_mossy'],
          blockLines: ['v-def-mossy', 'v-fill-mossy'],
          html: `${kw('@rule')}(probability=${num('0.25')})`
        },
        {
          id: 'v-def-mossy',
          ruleGroup: 'v_mossy',
          scopes: ['v_mossy'],
          blockLines: ['v-fill-mossy'],
          html: `${kw('def')} ${fn('wall_block')}():`
        },
        {
          id: 'v-fill-mossy',
          ruleGroup: 'v_mossy',
          scopes: ['v_mossy'],
          html: `${sp(2)}${fn('fill')}(${con('MOSSY_COBBLESTONE')})`
        },
        { gap: true },
        {
          id: 'v-dec-cobble',
          ruleGroup: 'v_cobble',
          scopes: ['v_cobble'],
          blockLines: ['v-def-cobble', 'v-fill-cobble'],
          html: `${kw('@rule')}(probability=${num('0.15')})`
        },
        {
          id: 'v-def-cobble',
          ruleGroup: 'v_cobble',
          scopes: ['v_cobble'],
          blockLines: ['v-fill-cobble'],
          html: `${kw('def')} ${fn('wall_block')}():`
        },
        {
          id: 'v-fill-cobble',
          ruleGroup: 'v_cobble',
          scopes: ['v_cobble'],
          html: `${sp(2)}${fn('fill')}(${con('COBBLESTONE')})`
        }
      ];
    }

    function buildControls() {
      controlsCol.innerHTML = '';

      if (MODE === 'constraints') {
        const card = document.createElement('div');
        card.className = 'control-card';
        card.innerHTML = `
          <div class="control-head">
            <span class="control-label">Width (X)</span>
            <span class="control-val" id="width-val">${state.width} Blocks</span>
          </div>
          <input type="range" id="slider-width" min="6" max="15" step="1" value="${state.width}" aria-label="Wall width in blocks">
          <div class="threshold-bar">
            <span>6</span>
            <span>15</span>
          </div>
        `;
        controlsCol.appendChild(card);

        const sliderWidth = document.getElementById('slider-width');
        sliderWidth.addEventListener('input', () => {
          state.width = Number(sliderWidth.value);
          clearHover(false);
          updateUI();
        });
      } else if (MODE === 'loops') {
        const toggleCard = document.createElement('div');
        toggleCard.className = 'control-card';
        toggleCard.innerHTML = `
          <span class="control-label">Battlements</span>
          <div class="btn-group">
            <button type="button" class="btn-tab" id="btn-flat">Flat</button>
            <button type="button" class="btn-tab active" id="btn-repeat">Repeat [1, 1]</button>
          </div>
        `;
        controlsCol.appendChild(toggleCard);

        const widthCard = document.createElement('div');
        widthCard.className = 'control-card';
        widthCard.innerHTML = `
          <div class="control-head">
            <span class="control-label">Width (X)</span>
            <span class="control-val" id="width-val">${state.width} Blocks</span>
          </div>
          <input type="range" id="slider-width" min="7" max="15" step="1" value="${state.width}" aria-label="Wall width in blocks">
        `;
        controlsCol.appendChild(widthCard);

        const btnFlat = document.getElementById('btn-flat');
        const btnRepeat = document.getElementById('btn-repeat');
        const sliderWidth = document.getElementById('slider-width');

        btnFlat.addEventListener('click', () => {
          if (!state.repeatLoop) return;
          state.repeatLoop = false;
          btnFlat.classList.add('active');
          btnRepeat.classList.remove('active');
          clearHover(false);
          updateUI();
        });

        btnRepeat.addEventListener('click', () => {
          if (state.repeatLoop) return;
          state.repeatLoop = true;
          btnRepeat.classList.add('active');
          btnFlat.classList.remove('active');
          clearHover(false);
          updateUI();
        });

        sliderWidth.addEventListener('input', () => {
          state.width = Number(sliderWidth.value);
          clearHover(false);
          updateUI();
        });
      } else {
        const btnRegen = document.createElement('button');
        btnRegen.type = 'button';
        btnRegen.className = 'btn-regen';
        btnRegen.id = 'btn-regenerate';
        btnRegen.innerHTML = '<span>&#8635;</span><span>Regenerate</span>';
        controlsCol.appendChild(btnRegen);

        const legendCard = document.createElement('div');
        legendCard.className = 'control-card';
        legendCard.innerHTML = `<span class="control-label">Block Weights</span><div class="variant-list" id="variant-list"></div>`;
        controlsCol.appendChild(legendCard);

        const listEl = document.getElementById('variant-list');
        const rows = [
          { tag: 'v_bricks', lineId: 'v-dec-bricks', mat: 'stone_bricks', name: 'Stone Brick', prob: '0.60' },
          { tag: 'v_mossy', lineId: 'v-dec-mossy', mat: 'mossy_cobblestone', name: 'Mossy Cobblestone', prob: '0.25' },
          { tag: 'v_cobble', lineId: 'v-dec-cobble', mat: 'cobblestone', name: 'Cobblestone', prob: '0.15' }
        ];

        for (const item of rows) {
          const row = document.createElement('div');
          row.className = 'variant-row';
          row.dataset.scopeTag = item.tag;
          row.innerHTML = `
            <canvas class="variant-swatch" width="16" height="16"></canvas>
            <span class="variant-name">${item.name}</span>
            <span class="variant-prob">${item.prob}</span>
          `;
          const sw = row.querySelector('canvas');
          const swCtx = sw.getContext('2d');
          swCtx.imageSmoothingEnabled = false;
          const drawSwatch = () => {
            const tex = getTextureSource(item.mat);
            if (tex) swCtx.drawImage(tex, 0, 0, tex.width, tex.height, 0, 0, 16, 16);
          };
          drawSwatch();
          if (!assetTextures[item.mat]) {
            const img = new Image();
            img.onload = () => swCtx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 16, 16);
            if (item.mat === 'stone_bricks') img.src = 'assets/stone_bricks.png?v=5';
            else if (item.mat === 'cobblestone') img.src = 'assets/cobblestone.png?v=5';
          }

          row.addEventListener('pointerenter', () => setHover([item.tag], item.lineId));
          row.addEventListener('pointerleave', () => clearHover(true));
          listEl.appendChild(row);
          variantRowMap.set(item.tag, row);
        }

        btnRegen.addEventListener('click', () => {
          triggerVariantFade();
        });
      }
    }

    function renderCodeLines() {
      const spec = buildCodeSpec();
      currentCodeMeta = spec;
      codeLinesEl.innerHTML = '';
      lineElMap.clear();

      for (const item of spec) {
        if (item.gap) {
          const gap = document.createElement('div');
          gap.className = 'code-gap';
          codeLinesEl.appendChild(gap);
          continue;
        }
        const el = document.createElement('div');
        el.className = 'code-line';
        el.dataset.lineId = item.id;
        el.innerHTML = item.html;

        if (MODE === 'constraints') {
          const isActiveRule = item.ruleGroup === currentEval.activeRuleGroup;
          el.classList.add(isActiveRule ? 'is-rule-fired' : 'is-rule-dimmed');
        } else {
          el.classList.add('is-rule-fired');
        }

        el.addEventListener('pointerenter', () => {
          if (MODE === 'constraints' && item.ruleGroup !== currentEval.activeRuleGroup) return;
          setHover(item.scopes, item.id);
        });

        codeLinesEl.appendChild(el);
        lineElMap.set(item.id, el);
      }
    }

    codeLinesEl.addEventListener('pointerleave', () => clearHover(true));

    function syncRuleHighlightStyles() {
      for (const el of lineElMap.values()) {
        el.classList.remove('is-focus', 'is-encompassed');
      }
      for (const row of variantRowMap.values()) {
        row.classList.remove('is-active');
      }

      if (state.hoverLineId) {
        const meta = currentCodeMeta.find((m) => m.id === state.hoverLineId);
        if (meta) {
          lineElMap.get(meta.id)?.classList.add('is-focus');
          for (const bid of meta.blockLines ?? []) {
            lineElMap.get(bid)?.classList.add('is-encompassed');
          }
        }
      }

      if (state.hoverScopes) {
        for (const tag of state.hoverScopes) {
          variantRowMap.get(tag)?.classList.add('is-active');
        }
      }
    }

    function setHover(scopes, lineId) {
      state.hoverScopes = scopes ? new Set(scopes) : null;
      state.hoverLineId = lineId ?? null;
      syncRuleHighlightStyles();
      renderCanvas();
    }

    function clearHover(redraw = true) {
      if (!state.hoverScopes && !state.hoverLineId) return;
      state.hoverScopes = null;
      state.hoverLineId = null;
      syncRuleHighlightStyles();
      if (redraw) renderCanvas();
    }

    function triggerVariantFade() {
      const prevMap = new Map();
      for (const cell of currentEval.cells) {
        prevMap.set(`${cell.x},${cell.y}`, cell.fg);
      }
      state.prevCellsMap = prevMap;
      state.seed = nextDistinctSeed(state.seed, state.width, state.height);
      currentEval = evaluateState();
      state.fadeProgress = 0;
      state.fadeToken += 1;
      const myToken = state.fadeToken;
      const start = performance.now();

      function step(now) {
        if (myToken !== state.fadeToken) return;
        const t = Math.min(1, (now - start) / 220);
        state.fadeProgress = 1 - Math.pow(1 - t, 3);
        renderCanvas();
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          state.prevCellsMap = null;
          state.fadeProgress = 1;
          renderCanvas();
        }
      }
      requestAnimationFrame(step);
    }

    function getWallOrigin(cw, ch, width, height) {
      const totalW = width * CELL_PX;
      const totalH = height * CELL_PX;
      return {
        ox: Math.round((cw - totalW) / 2),
        oy: Math.round((ch - totalH) / 2) + 12,
        totalW,
        totalH
      };
    }

    function traceWallBoundary(c, ox, oy, width, height, creneled) {
      c.beginPath();
      if (!creneled) {
        c.rect(ox, oy, width * CELL_PX, height * CELL_PX);
        return;
      }
      c.moveTo(ox, oy);
      for (let x = 0; x < width; x++) {
        if (x % 2 === 0) {
          c.lineTo(ox + x * CELL_PX, oy);
          c.lineTo(ox + (x + 1) * CELL_PX, oy);
        } else {
          c.lineTo(ox + x * CELL_PX, oy + CELL_PX);
          c.lineTo(ox + (x + 1) * CELL_PX, oy + CELL_PX);
        }
      }
      c.lineTo(ox + width * CELL_PX, oy + height * CELL_PX);
      c.lineTo(ox, oy + height * CELL_PX);
      c.closePath();
    }

    function drawCellForeground(cell, px, py) {
      if (!cell.fg) return;
      const tex = getTextureSource(cell.fg);
      if (!tex) return;

      if (cell.jambMode === 'left') {
        const w = Math.round(CELL_PX * 0.56);
        ctx.drawImage(tex, 0, 0, tex.width * 0.56, tex.height, px, py, w, CELL_PX);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
        ctx.fillRect(px + w - 1, py, 2, CELL_PX);
      } else if (cell.jambMode === 'right') {
        const w = Math.round(CELL_PX * 0.56);
        const startX = px + CELL_PX - w;
        ctx.drawImage(tex, tex.width * 0.44, 0, tex.width * 0.56, tex.height, startX, py, w, CELL_PX);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
        ctx.fillRect(startX - 1, py, 2, CELL_PX);
      } else {
        ctx.drawImage(tex, 0, 0, tex.width, tex.height, px, py, CELL_PX, CELL_PX);
      }
    }

    function renderCanvas() {
      if (!state.isVisible) return;
      const cw = canvas.clientWidth || 436;
      const ch = canvas.clientHeight || 282;
      const targetW = Math.round(cw * state.detailScale);
      const targetH = Math.round(ch * state.detailScale);
      if (canvas.width !== targetW) canvas.width = targetW;
      if (canvas.height !== targetH) canvas.height = targetH;

      ctx.setTransform(state.detailScale, 0, 0, state.detailScale, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      ctx.imageSmoothingEnabled = false;

      const { width, height, hasCreneledOutline, cells, solidCuts, topLabels, boxes } = currentEval;
      const { ox, oy, totalW, totalH } = getWallOrigin(cw, ch, width, height);

      // 1. Top slice labels (placed cleanly above the root boundary)
      if (topLabels.length > 0) {
        ctx.save();
        ctx.font = '700 13px "JetBrains Mono", ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#64748b';
        for (const lbl of topLabels) {
          ctx.fillText(lbl.text, ox + (lbl.x + lbl.w / 2) * CELL_PX, oy - 9);
        }
        ctx.restore();
      }

      // 2. Clean white backdrop strictly inside the wall silhouette
      ctx.save();
      traceWallBoundary(ctx, ox, oy, width, height, hasCreneledOutline);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();

      // 3. Draw background layers (recessed oak planks in the gate doorway) + subtle top drop shadow
      for (const cell of cells) {
        if (!cell.bg) continue;
        const bgTex = getTextureSource(cell.bg);
        if (!bgTex) continue;
        const px = ox + cell.x * CELL_PX;
        const py = oy + cell.y * CELL_PX;
        ctx.drawImage(bgTex, 0, 0, bgTex.width, bgTex.height, px, py, CELL_PX, CELL_PX);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.34)';
        ctx.fillRect(px, py, CELL_PX, CELL_PX);
        if (cell.y === 2) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
          ctx.fillRect(px, py, CELL_PX, 5);
        }
      }

      // 4. Draw foreground blocks (with smooth cross-fade when Regenerate runs)
      for (const cell of cells) {
        const px = ox + cell.x * CELL_PX;
        const py = oy + cell.y * CELL_PX;

        if (state.prevCellsMap && state.fadeProgress < 1) {
          const oldMat = state.prevCellsMap.get(`${cell.x},${cell.y}`);
          if (oldMat) {
            const oldTex = getTextureSource(oldMat);
            if (oldTex) ctx.drawImage(oldTex, 0, 0, oldTex.width, oldTex.height, px, py, CELL_PX, CELL_PX);
          }
          ctx.save();
          ctx.globalAlpha = state.fadeProgress;
          drawCellForeground(cell, px, py);
          ctx.restore();
        } else {
          drawCellForeground(cell, px, py);
        }

        if (cell.isVoid) {
          ctx.fillStyle = 'rgba(2, 132, 199, 0.1)';
          ctx.fillRect(px, py, CELL_PX, CELL_PX);
        }
      }

      // 5. Subtle 1px unit grid lines across solid wall area
      ctx.save();
      traceWallBoundary(ctx, ox, oy, width, height, hasCreneledOutline);
      ctx.clip();
      ctx.strokeStyle = 'rgba(203, 213, 225, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let c = 1; c < width; c++) {
        const gx = Math.round(ox + c * CELL_PX) + 0.5;
        ctx.moveTo(gx, oy);
        ctx.lineTo(gx, oy + totalH);
      }
      for (let r = 1; r < height; r++) {
        const gy = Math.round(oy + r * CELL_PX) + 0.5;
        ctx.moveTo(ox, gy);
        ctx.lineTo(ox + totalW, gy);
      }
      ctx.stroke();
      ctx.restore();

      // 6. Solid executed split lines
      for (const cut of solidCuts) {
        ctx.save();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.25;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        if (cut.axis === 'V') {
          const cx = ox + cut.at * CELL_PX;
          ctx.moveTo(cx, oy + cut.from * CELL_PX);
          ctx.lineTo(cx, oy + cut.to * CELL_PX);
        } else {
          const cy = oy + cut.at * CELL_PX;
          ctx.moveTo(ox + cut.from * CELL_PX, cy);
          ctx.lineTo(ox + cut.to * CELL_PX, cy);
        }
        ctx.stroke();
        ctx.restore();
      }

      // 7. Outer boundary around root wall
      ctx.save();
      traceWallBoundary(ctx, ox, oy, width, height, hasCreneledOutline);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'miter';
      ctx.stroke();
      ctx.restore();

      // 8. Scope spotlight scrim + cyan glow (identical style to tower_canvas.js)
      if (state.hoverScopes && state.hoverScopes.size > 0) {
        const focusBoxes = boxes.filter((b) => state.hoverScopes.has(b.scopeTag));
        if (focusBoxes.length > 0) {
          ctx.save();
          traceWallBoundary(ctx, ox, oy, width, height, hasCreneledOutline);
          for (const b of focusBoxes) {
            ctx.rect(ox + b.x * CELL_PX, oy + b.y * CELL_PX, b.w * CELL_PX, b.h * CELL_PX);
          }
          ctx.fillStyle = 'rgba(15, 23, 42, 0.54)';
          ctx.fill('evenodd');
          ctx.restore();

          for (const b of focusBoxes) {
            const bx = ox + b.x * CELL_PX;
            const by = oy + b.y * CELL_PX;
            const bw = b.w * CELL_PX;
            const bh = b.h * CELL_PX;

            if (b.isVoid) {
              ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
              ctx.fillRect(bx, by, bw, bh);
            }

            ctx.save();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.95)';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = 'rgba(56, 189, 248, 0.85)';
            ctx.shadowBlur = 8;
            ctx.strokeRect(bx + 1.25, by + 1.25, Math.max(1, bw - 2.5), Math.max(1, bh - 2.5));
            ctx.restore();
          }
        }
      }
    }

    function updateUI() {
      currentEval = evaluateState();

      const widthVal = document.getElementById('width-val');
      if (widthVal) widthVal.textContent = `${state.width} Blocks`;

      renderCodeLines();
      syncRuleHighlightStyles();
      renderCanvas();
    }

    function resolveCanvasHit(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      const cw = canvas.clientWidth || 436;
      const ch = canvas.clientHeight || 282;
      const scaleX = cw / r.width;
      const scaleY = ch / r.height;
      const localX = (clientX - r.left) * scaleX;
      const localY = (clientY - r.top) * scaleY;
      const { width, height, boxes } = currentEval;
      const { ox, oy } = getWallOrigin(cw, ch, width, height);
      const gx = (localX - ox) / CELL_PX;
      const gy = (localY - oy) / CELL_PX;
      if (gx < 0 || gx >= width || gy < 0 || gy >= height) return null;

      const hit = boxes.find((b) => gx >= b.x && gx < b.x + b.w && gy >= b.y && gy < b.y + b.h);
      if (!hit) return null;

      const scopeToLine = {
        c_left: 'c-fill-l',
        c_gate: 'c-gate',
        c_right: 'c-fill-r',
        c_else: 'c-fill-else',
        l_base: 'l-base',
        l_merlon: 'l-fill',
        l_void: 'l-void',
        l_flat: 'l-flat',
        v_bricks: 'v-fill-bricks',
        v_mossy: 'v-fill-mossy',
        v_cobble: 'v-fill-cobble'
      };
      return {
        scopes: [hit.scopeTag],
        lineId: scopeToLine[hit.scopeTag] || null
      };
    }

    canvas.addEventListener('pointermove', (e) => {
      const found = resolveCanvasHit(e.clientX, e.clientY);
      if (found) {
        canvas.style.cursor = 'pointer';
        setHover(found.scopes, found.lineId);
      } else {
        canvas.style.cursor = 'default';
        clearHover(true);
      }
    });

    canvas.addEventListener('pointerleave', () => {
      canvas.style.cursor = 'default';
      clearHover(true);
    });

    window.addEventListener('resize', () => {
      if (state.isVisible) renderCanvas();
    });

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'deck:visibility') {
        state.isVisible = Boolean(event.data.visible);
        if (state.isVisible) renderCanvas();
      }
      if (event.data?.type === 'deck:resolution') {
        state.detailScale = event.data.detail || window.devicePixelRatio || 1;
        if (state.isVisible) renderCanvas();
      }
    });

    buildControls();
    updateUI();
  </script>
</body>

</html>
