<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Box-Split Knife & Live Python Code</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 900px;
      height: 460px;
      overflow: hidden;
      background: #0f1422;
      color: #e2e8f0;
      font-family: "Nunito Sans", system-ui, -apple-system, sans-serif;
    }

    .demo-container {
      display: grid;
      grid-template-columns: 360px 160px 320px;
      gap: 20px;
      width: 100%;
      height: 100%;
      padding: 20px;
      align-items: center;
    }

    /* Column 1: Canvas */
    .canvas-wrap {
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid #2d3b55;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Column 2: Controls */
    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 380px;
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .btn-group {
      display: flex;
      border: 1px solid #334155;
      border-radius: 7px;
      overflow: hidden;
      background: #182032;
    }

    .btn-tab {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      background: #182032;
      color: #94a3b8;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-tab:hover {
      background: #232f48;
      color: #f8fafc;
    }

    .btn-tab.active {
      background: #0284c7;
      color: #ffffff;
    }

    /* Texture swatch selector */
    .texture-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .texture-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #2d3b55;
      background: #182032;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .texture-option:hover {
      border-color: #38bdf8;
      background: #1e293b;
      color: #fff;
    }

    .texture-option.active {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
    }

    .texture-swatch {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      image-rendering: pixelated;
    }

    .btn-reset {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #334155;
      border-radius: 7px;
      background: #182032;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: auto;
    }

    .btn-reset:hover {
      background: #ef4444;
      border-color: #f87171;
      color: #ffffff;
    }

    /* Column 3: Python Code Panel */
    .code-panel {
      display: flex;
      flex-direction: column;
      height: 380px;
      background: #090d16;
      border: 1px solid #28354b;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #131b2c;
      border-bottom: 1px solid #28354b;
    }

    .code-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-copy {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
    }

    .btn-copy:hover {
      background: #334155;
      color: #fff;
    }

    .code-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    .code-line {
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s ease-out, border-color 0.12s ease-out, color 0.12s ease-out;
      white-space: pre;
      border-left: 2.5px solid transparent;
    }

    /* Hovering an encompassing block highlights all its lines with a subtle tint and left guide rail */
    .code-line.code-block-encompassed {
      background: rgba(56, 189, 248, 0.09);
      border-left-color: #38bdf8;
    }

    /* The specific line directly under the cursor */
    .code-line.code-line-header-hover {
      background: rgba(56, 189, 248, 0.22);
      border-left-color: #38bdf8;
      color: #ffffff;
    }

    /* Code Highlighting Colors */
    .code-line .kw {
      color: #f472b6;
      font-weight: 600;
    }

    .code-line .fn {
      color: #38bdf8;
      font-weight: 600;
    }

    .code-line .dim {
      color: #c084fc;
      font-weight: 600;
    }

    .code-line .num {
      color: #fbbf24;
    }

    .code-line .const {
      color: #34d399;
      font-weight: 600;
    }

    .code-footer {
      padding: 5px 12px;
      background: #131b2c;
      border-top: 1px solid #28354b;
      font-size: 10px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="demo-container">

    <!-- Left: 10x10 Canvas -->
    <div class="canvas-wrap">
      <canvas id="knife-canvas"></canvas>
    </div>

    <!-- Middle: Controls -->
    <div class="controls-wrap">
      <div class="control-group">
        <span class="control-label">Tool</span>
        <div class="btn-group">
          <button id="tool-cut" class="btn-tab active">🔪 Cut</button>
          <button id="tool-fill" class="btn-tab">🪣 Fill</button>
        </div>
      </div>

      <div id="cut-options" class="control-group">
        <span class="control-label">Cut Direction</span>
        <div class="btn-group">
          <button id="btn-horizontal" class="btn-tab active">Horizontal</button>
          <button id="btn-vertical" class="btn-tab">Vertical</button>
        </div>
      </div>

      <div id="fill-options" class="control-group" style="display: none;">
        <span class="control-label">Minecraft Block</span>
        <div class="texture-list">
          <div class="texture-option active" data-texture="oak_log">
            <canvas class="texture-swatch" id="swatch-oak-log" width="16" height="16"></canvas>
            <span>Oak Log</span>
          </div>
          <div class="texture-option" data-texture="cobblestone">
            <canvas class="texture-swatch" id="swatch-cobblestone" width="16" height="16"></canvas>
            <span>Cobblestone</span>
          </div>
          <div class="texture-option" data-texture="oak_planks">
            <canvas class="texture-swatch" id="swatch-oak-planks" width="16" height="16"></canvas>
            <span>Oak Planks</span>
          </div>
        </div>
      </div>

      <button id="btn-reset" class="btn-reset">Reset Square</button>
    </div>

    <!-- Right: Live Python Grammar Code Panel -->
    <div class="code-panel">
      <div class="code-header">
        <div class="code-title">🐍 Live Python Code</div>
        <button id="btn-copy" class="btn-copy" title="Copy to clipboard">Copy</button>
      </div>
      <div class="code-body" id="code-body">
        <!-- Rendered code lines populate here -->
      </div>
      <div class="code-footer">
        <span>Hover code to highlight region</span>
        <span id="copy-status"></span>
      </div>
    </div>

  </div>

  <script type="module">
    import { createInitialModel } from './model.js';
    import { CanvasRenderer } from './renderer.js';
    import { KnifeController } from './interaction.js';
    import { TEXTURE_TYPES } from './textures.js';
    import { generateGrammarCode } from './codegen.js';

    const canvas = document.getElementById('knife-canvas');
    let model = createInitialModel();
    const renderer = new CanvasRenderer(canvas);
    let isVisible = true;
    let currentRawCode = '';
    let currentCodeLines = [];

    // Debounce timer for smooth 50ms (0.05s) hover activation
    let hoverTimer = null;
    const HOVER_DELAY_MS = 50;

    const codeBody = document.getElementById('code-body');
    const btnCopy = document.getElementById('btn-copy');
    const copyStatus = document.getElementById('copy-status');

    function clearCodeHighlights() {
      const lineEls = codeBody.querySelectorAll('.code-line');
      lineEls.forEach((el) => {
        el.classList.remove('code-block-encompassed', 'code-line-header-hover');
      });
    }

    function applyCodeHighlight(lineIndex) {
      clearCodeHighlights();
      const meta = currentCodeLines[lineIndex];
      if (!meta || meta.nodeId === null) {
        renderer.setCodeHighlightId(null);
        return;
      }

      // Highlight all encompassed child lines in that block range
      const lineEls = codeBody.querySelectorAll('.code-line');
      for (let i = meta.blockStart; i <= meta.blockEnd; i++) {
        if (lineEls[i]) {
          lineEls[i].classList.add('code-block-encompassed');
        }
      }

      // Emphasize the direct line under cursor
      if (lineEls[lineIndex]) {
        lineEls[lineIndex].classList.add('code-line-header-hover');
      }

      // Trigger animated darkening of all other regions on canvas
      renderer.setCodeHighlightId(meta.nodeId);
    }

    function updateCodePanel() {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }

      const { lines, fullRawText } = generateGrammarCode(model);
      currentRawCode = fullRawText;
      currentCodeLines = lines;

      codeBody.innerHTML = '';
      lines.forEach((line, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'code-line';
        lineEl.dataset.lineIndex = String(index);
        lineEl.innerHTML = line.textHtml;

        // 50ms (0.05s) delay before beginning highlight
        lineEl.addEventListener('mouseenter', () => {
          if (hoverTimer) clearTimeout(hoverTimer);
          hoverTimer = setTimeout(() => {
            applyCodeHighlight(index);
          }, HOVER_DELAY_MS);
        });

        lineEl.addEventListener('mouseleave', () => {
          // If cursor left before the 50ms delay completed, cancel it immediately
          if (hoverTimer) {
            clearTimeout(hoverTimer);
            hoverTimer = null;
          }
        });

        codeBody.appendChild(lineEl);
      });
    }

    // When cursor leaves the entire code panel, cancel timer and fade out immediately with no delay
    codeBody.addEventListener('mouseleave', () => {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }
      clearCodeHighlights();
      renderer.setCodeHighlightId(null);
    });

    // If mouse moves into non-line empty space within codeBody, un-highlight with no delay
    codeBody.addEventListener('mousemove', (e) => {
      if (!e.target.closest('.code-line')) {
        if (hoverTimer) {
          clearTimeout(hoverTimer);
          hoverTimer = null;
        }
        clearCodeHighlights();
        renderer.setCodeHighlightId(null);
      }
    });

    const controller = new KnifeController(model, renderer, () => {
      updateCodePanel();
    });

    // Draw miniature swatches
    function drawSwatches() {
      const swatches = [
        { id: 'swatch-oak-log', type: TEXTURE_TYPES.OAK_LOG },
        { id: 'swatch-cobblestone', type: TEXTURE_TYPES.COBBLESTONE },
        { id: 'swatch-oak-planks', type: TEXTURE_TYPES.OAK_PLANKS },
      ];
      for (const s of swatches) {
        const swCanvas = document.getElementById(s.id);
        const texCanvas = renderer.textureLib.getCanvas(s.type);
        if (swCanvas && texCanvas) {
          const swCtx = swCanvas.getContext('2d');
          swCtx.drawImage(texCanvas, 0, 0);
        }
      }
    }
    drawSwatches();

    // Mode Toggle Elements
    const toolCut = document.getElementById('tool-cut');
    const toolFill = document.getElementById('tool-fill');
    const cutOptions = document.getElementById('cut-options');
    const fillOptions = document.getElementById('fill-options');

    toolCut.addEventListener('click', () => {
      controller.setMode('cut');
      toolCut.classList.add('active');
      toolFill.classList.remove('active');
      cutOptions.style.display = 'flex';
      fillOptions.style.display = 'none';
    });

    toolFill.addEventListener('click', () => {
      controller.setMode('fill');
      toolFill.classList.add('active');
      toolCut.classList.remove('active');
      cutOptions.style.display = 'none';
      fillOptions.style.display = 'flex';
    });

    // Cut Direction Buttons
    const btnHorizontal = document.getElementById('btn-horizontal');
    const btnVertical = document.getElementById('btn-vertical');

    btnHorizontal.addEventListener('click', () => {
      controller.setAxis('H');
      btnHorizontal.classList.add('active');
      btnVertical.classList.remove('active');
    });

    btnVertical.addEventListener('click', () => {
      controller.setAxis('V');
      btnVertical.classList.add('active');
      btnHorizontal.classList.remove('active');
    });

    // Texture Selection
    const textureOptions = document.querySelectorAll('.texture-option');
    textureOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        textureOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        const tex = opt.getAttribute('data-texture');
        controller.setTexture(tex);
      });
    });

    // Reset Button
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }
      model = createInitialModel();
      controller.model = model;
      controller.reset();
      clearCodeHighlights();
      renderer.setCodeHighlightId(null);
      updateCodePanel();
    });

    // Copy Button
    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentRawCode);
        copyStatus.textContent = 'Copied!';
        setTimeout(() => copyStatus.textContent = '', 2000);
      } catch (err) {
        copyStatus.textContent = 'Failed to copy';
      }
    });

    // Window and Deck Lifecycle Listeners
    function handleResize() {
      renderer.resize();
      if (isVisible) controller.render();
    }

    window.addEventListener('resize', handleResize);

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'deck:visibility') {
        isVisible = Boolean(event.data.visible);
        if (isVisible) controller.render();
      }
      if (event.data?.type === 'deck:resolution') {
        renderer.setResolution(event.data.detail || window.devicePixelRatio || 1);
        if (isVisible) controller.render();
      }
    });

    // Initial render
    handleResize();
    updateCodePanel();
  </script>
</body>

</html>
